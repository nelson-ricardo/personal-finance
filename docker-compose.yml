services:
  db:
    image: postgres:18-alpine
    container_name: budget_app_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-budget_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgeter} -d ${POSTGRES_DB:-budget_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: