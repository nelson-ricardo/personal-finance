[build-system]
requires = ["uv_build>=0.1.0, <0.13"]
build-backend = "uv_build"

[project]
name = "budget_app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
]

[tool.uv.build-backend]
module-roots = ["src"]
packages = ["budget_app"]